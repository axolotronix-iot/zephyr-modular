# Exercise 9: custom out-of-tree LED bar driver

# Enable the out-of-tree led_bar module and its logging.
# Per-module log levels are NOT set here: they come from a config fragment
# (debug.conf, passed with -DEXTRA_CONF_FILE). Trace stays compiled out in
# the default build so the binary contains no demo/led_bar log strings.
CONFIG_LED_BAR=y
CONFIG_LOG=y