# Exercise 8: gpio-keys, GPIO hogs, and DT aliases

# Input subsystem and the gpio-keys driver that turns the board/protoboard
# buttons into INPUT_EV_KEY events (subsys/input/Kconfig,
# drivers/input/Kconfig.gpio_keys).
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# Enable the DT-driven GPIO hogs used to initialize the LED outputs
# (drivers/gpio/Kconfig, CONFIG_GPIO_HOGS; gpio_hogs.c).
CONFIG_GPIO_HOGS=y